name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      # Security/correctness logic (ZIP budgets, page ranges, header parsing,
      # size guards, worker protocol). Runs in Node, no browser needed.
      - name: Unit tests
        run: npm test

      # Builds the client bundle, renders every route to static HTML, and
      # generates sitemap.xml, robots.txt and 404.html.
      #
      # SITE_URL is the absolute origin used in canonicals and the sitemap. Set
      # it as a repository variable (or here) when the site moves to a custom
      # domain; the default is the project Pages URL.
      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Every route is a real directory with an index.html, so deep links and
      # refreshes work without rewrite rules. The artifact still uses relative
      # asset paths, so it also works at a subpath or on a custom domain.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
