name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every check lives in `verify.yml`, which also runs on pull requests. This job
  # only borrows it: keeping two copies of the gate list is how a deploy ends up
  # running one check fewer than the branch did.
  #
  # The build really does come before the tests, and `verify.yml` says why —
  # `tests/csp.test.ts` and the two SEO tests assert against the emitted site and
  # skip themselves when `dist` is missing, which is exactly the green build that
  # had quietly stopped checking the headers it exists to check.
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the client bundle, type-checks (`tsc -b`), renders every route to
      # static HTML, and generates sitemap.xml, robots.txt and 404.html, then
      # audits the CSP and every internal link.
      #
      # SITE_URL is the absolute origin used in canonicals and the sitemap. Set
      # it as a repository variable when the site moves to a custom domain; the
      # default is the project Pages URL.
      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Every route is a real directory with an index.html, so deep links and
      # refreshes work without rewrite rules. The artifact still uses relative
      # asset paths, so it also works at a subpath or on a custom domain.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Repository Settings → Pages must use “GitHub Actions” as its source.
      # Uploading an artifact does not enable Pages itself; deploying before it
      # is enabled fails with a 404 even when the build and tests are green.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
