<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      This file is the shell. `npm run build` renders every route into its own
      HTML document with its own title, description, canonical and Open Graph
      tags (see scripts/prerender.mjs). The values below are only what the dev
      server and a bare `vite build` fall back to.
    -->
    <meta
      name="description"
      content="Convert, compress, crop, merge, split, protect and inspect files in your browser. No upload, no account and no queue — the work happens on your device."
    />
    <meta name="theme-color" content="#08090b" />
    <title>ZeroUpload — Every File Tool, Nothing Uploaded</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      A real 180×180 touch icon, not the 1200×630 social card it used to point at:
      iOS letterboxes whatever it is given, so every home-screen shortcut was a
      squashed Open Graph image. Generated by `scripts/make-icons.mjs`.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="./sitemap.xml" />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('zeroupload.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      ZeroUpload processes files entirely in your browser and requires JavaScript to be enabled.
      Nothing you open here is ever uploaded — there is no server to upload it to.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
